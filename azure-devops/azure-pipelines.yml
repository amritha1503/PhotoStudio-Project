name: CI/CD Helm Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_REGISTRY: projectps.azurecr.io
      IMAGE_NAME: photostudio-app

    steps:
    # 1. Checkout repo
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 3. Log in to Azure Container Registry
    - name: Log in to ACR
      uses: docker/login-action@v2
      with:
        registry: ${{ env.IMAGE_REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}   # Set in GitHub secrets
        password: ${{ secrets.ACR_PASSWORD }}   # Set in GitHub secrets

    # 4. Build and push Docker image
    - name: Build and push Docker image
      run: |
        IMAGE_TAG=${GITHUB_SHA::7}
        docker build -t $IMAGE_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
        docker push $IMAGE_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

    # 5. Update Helm values.yaml with new image tag
    - name: Update Helm values.yaml
      run: |
        IMAGE_TAG=${GITHUB_SHA::7}
        yq e -i '.image.repository = "'"$IMAGE_REGISTRY/$IMAGE_NAME"'"' ./charts/photostudio-app/values.yaml
        yq e -i '.image.tag = "'"$IMAGE_TAG"'"' ./charts/photostudio-app/values.yaml

    # 6. Package Helm chart
    - name: Package Helm chart
      run: |
        helm package ./charts/photostudio-app --destination ./helm-packages

    # 7. Upload all Helm templates as artifacts
    - name: Upload Helm templates
      uses: actions/upload-artifact@v3
      with:
        name: helm-templates
        path: ./charts/photostudio-app/templates/*

    # 8. Upload packaged Helm chart as artifact
    - name: Upload Helm chart package
      uses: actions/upload-artifact@v3
      with:
        name: helm-chart-package
        path: ./helm-packages/*.tgz
