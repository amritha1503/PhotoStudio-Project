trigger:
- azure-devops

variables:
  imageName: photostudio
  acrLoginServer: projectps.azurecr.io
  tag: $(Build.BuildId)
  argocdServer: argocd.example.com        # Replace with your Argo CD server URL
  argocdUser: admin                       # Replace if different
  argocdPassword: $(ARGOCD_PASSWORD)      # Store Argo CD password in pipeline secret
  argocdAppName: photostudio-app
  argocdNamespace: psns

pool:
  vmImage: ubuntu-latest

steps:
# 1️⃣ Checkout repo
- checkout: self
  persistCredentials: true

# 2️⃣ Build & push Docker image
- task: Docker@2
  displayName: Build and Push Image
  inputs:
    command: buildAndPush
    repository: $(imageName)
    dockerfile: Dockerfile
    containerRegistry: photostudio-app-SRsc
    tags: |
      $(tag)

# 3️⃣ Update Helm values.yaml
- script: |
    echo "Updating Helm values.yaml with new tag $(tag)"
    sed -i "s/tag:.*/tag: \"$(tag)\"/" charts/photostudio-app/values.yaml

    git config user.email "azure-devops@pipeline.com"
    git config user.name "azure-devops"

    git fetch origin
    git checkout -B azure-devops origin/azure-devops
    git add charts/photostudio-app/values.yaml
    git commit -m "Update image tag to $(tag)"
    git push https://$GITHUB_PAT@github.com/amritha1503/PhotoStudio-Project.git azure-devops
  displayName: Update Helm values
  env:
    GITHUB_PAT: $(GITHUB_PAT)

# 4️⃣ Publish pipeline artifact (optional)
- task: PublishPipelineArtifact@1
  displayName: 'Publish Kubernetes Manifests'
  inputs:
    targetPath: '$(Build.SourcesDirectory)'
    artifact: 'k8s-manifests'
    publishLocation: 'pipeline'

# 5️⃣ Trigger Argo CD sync
- script: |
    echo "Logging in to Argo CD"
    argocd login $(argocdServer) --username $(argocdUser) --password $(argocdPassword) --insecure

    echo "Syncing Argo CD application $(argocdAppName)"
    argocd app sync $(argocdAppName) --grpc-web
  displayName: 'Trigger Argo CD Sync'
  env:
    ARGOCD_PASSWORD: $(ARGOCD_PASSWORD)
